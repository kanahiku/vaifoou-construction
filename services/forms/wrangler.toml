# Local/staging copy only. The production `massic-forms` Worker is deployed
# exclusively from the shared forms repository.
name = "massic-forms-vaifoou-construction-dev"
main = "src/index.ts"
compatibility_date = "2026-01-15"
workers_dev = true

# Replace database_id after: npx wrangler d1 create massic-forms
[[d1_databases]]
binding = "DB"
database_name = "massic-forms"
database_id = "376bc987-bf24-4f8c-88e0-64ce2daacf61"

# Safe to commit. Secrets (RESEND_API_KEY, TURNSTILE_SECRET, NOTIFY_EMAIL) go in
# .dev.vars locally and `wrangler secret put` in production.
[vars]
# RESEND_FROM is intentionally NOT set here.
# Each site has its own from_email in the D1 `sites` table.
# Setting this globally would override ALL sites with a single sender name (wrong).
# Notify emails per site per UTC day. Extra leads still save; visitor still sees success.
RESEND_DAILY_LIMIT = "1000"
